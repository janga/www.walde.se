name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLI_GALLERY_SITE_DIR: site

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Restore generated image cache
        uses: actions/cache@v6
        with:
          path: public/images/generated
          key: generated-images-${{ runner.os }}-${{ hashFiles(format('{0}/.cli-gallery/generated-images.json', env.CLI_GALLERY_SITE_DIR)) }}
          restore-keys: |
            generated-images-${{ runner.os }}-

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick libimage-exiftool-perl

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
